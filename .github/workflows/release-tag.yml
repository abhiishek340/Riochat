name: Release tag

# When VERSION changes on main, tag the commit as v<VERSION> and start the
# desktop release and image workflows for that tag. Tag pushes made with the
# default token do not trigger other workflows on their own, hence the explicit
# dispatches. Publishing the resulting draft release stays a human step.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Start the release workflows
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          gh workflow run desktop.yml --ref "${TAG}"
          gh workflow run docker.yml --ref "${TAG}"
