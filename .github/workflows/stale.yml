name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 7
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 7 days and is marked as stale.
            Add a comment if it is still relevant; otherwise it is closed in 7 days.
          stale-pr-message: >
            This pull request has had no activity for 7 days and is marked as stale.
            Push a commit or leave a comment to keep it open; otherwise it is closed in 7 days.
          close-issue-message: >
            Closed after 7 more days without activity. Reopen it if the problem persists.
          close-pr-message: >
            Closed after 7 more days without activity. Reopen it when you are ready to continue.
