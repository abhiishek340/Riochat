name: Bug report
description: Something does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets, tokens or personal data.
        Security problems must go through the private process in the security policy.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web client
        - Backend / API
        - Authentication
        - Conversations and streaming
        - Files and knowledge bases
        - Model routing and providers
        - Tool servers (MCP) and skills
        - Billing and payments
        - Admin console
        - Desktop shell
        - Deployment and configuration
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the `VERSION` file or `GET /api/v1/version`.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run it (container, binary, desktop), database and cache drivers, operating system, browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs and request id
      description: Relevant log lines and the `requestId` from the error response, with secrets removed.
      render: text
