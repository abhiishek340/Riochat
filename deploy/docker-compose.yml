# Default profile: the Riochat app only. PostgreSQL and Redis are external and
# reached through the configuration file (for services on the Docker host use
# host.docker.internal, mapped below).
#
#   cp deploy/config.example.yaml deploy/config.yaml     # then edit
#   docker compose -f deploy/docker-compose.yml up -d
#
# The port is published on loopback only; put a TLS reverse proxy in front for
# public access. Use a locally built image with:
#   docker build -t riochat:local . && RIOCHAT_CHAT_IMAGE=riochat:local docker compose -f deploy/docker-compose.yml up -d

name: riochat

services:
  app:
    image: ${RIOCHAT_CHAT_IMAGE:-ghcr.io/riochat/riochat:latest}
    container_name: riochat-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - riochat-app-storage:/app/storage
      - riochat-app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - riochat-network

networks:
  riochat-network:
    name: riochat-network

volumes:
  riochat-app-storage:
    name: riochat-app-storage
  riochat-app-data:
    name: riochat-app-data
