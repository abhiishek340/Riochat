# Tesseract extraction service. Start an application profile first (it creates
# riochat-network) or create the network by hand: docker network create riochat-network
#
#   docker compose -f deploy/services/tesseract/docker-compose.yml up -d --build
#
# Point the application at http://host.docker.internal:8004/ocr. The engine
# settings below are read from the host environment, with these defaults.

name: riochat-tesseract

services:
  tesseract:
    build: .
    container_name: riochat-tesseract
    restart: unless-stopped
    environment:
      TESSERACT_LANG: ${TESSERACT_LANG:-chi_sim+eng}
      TESSERACT_PSM: ${TESSERACT_PSM:-3}
      TESSERACT_OEM: ${TESSERACT_OEM:-3}
      TESSERACT_RENDER_SCALE: ${TESSERACT_RENDER_SCALE:-2.0}
      TESSERACT_GRAYSCALE: ${TESSERACT_GRAYSCALE:-true}
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - riochat-network

networks:
  riochat-network:
    external: true
    name: riochat-network
